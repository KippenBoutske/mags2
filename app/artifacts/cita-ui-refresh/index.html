<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cita — nieuwe UI</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 24px 40px;color:#f1f0eb;background:#14171b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{max-width:1000px;margin:0 auto 24px}h1{font-size:32px;margin:0 0 6px;letter-spacing:-.04em}p{margin:0;color:#c7c5bd}.grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}.card{margin:0;padding:14px;background:#1c2025;border:1px solid #333940;border-radius:20px;box-shadow:0 12px 30px #0004}.card img{display:block;width:100%;height:auto;border-radius:12px}.card figcaption{padding:12px 4px 2px;font-size:14px;font-weight:600;color:#f1f0eb}small{display:block;color:#c7c5bd;font-size:12px;margin-top:3px}
</style></head><body>
<header><h1>Cita · nieuwe UI</h1><p>Voorbeeldschermen · licht thema · 412 dp</p></header>
<main class="grid">
<figure class="card"><img src="today-412dp.png" alt="Vandaag-overzicht in Cita"><figcaption>Vandaag<small>Les, cijfers en huiswerk</small></figcaption></figure>
<figure class="card"><img src="rooster-412dp.png" alt="Rooster in Cita"><figcaption>Rooster<small>Weeknavigatie en huidige lesbadge</small></figcaption></figure>
<figure class="card"><img src="cijfers-412dp.png" alt="Cijfers in Cita"><figcaption>Cijfers<small>Gemiddelden en voortgang</small></figcaption></figure>
</main></body></html>
