name: Build Mags & Wear OS

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build Phone & Wear OS Debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: mags-phone-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: mags-wear-debug
          path: wear/build/outputs/apk/debug/*.apk
