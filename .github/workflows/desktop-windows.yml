name: Build Mags Desktop (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run desktop unit tests
        run: ./gradlew :desktop:test

      - name: Package Windows MSI & EXE
        run: ./gradlew :desktop:packageMsi :desktop:packageExe

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: mags-desktop-windows
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
