name: Desktop MSI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  msi:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Wrapper is used when present; gradle-version covers a missing wrapper JAR.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # :core is a KMP library with an Android target, so packageMsi still
      # configures the Android SDK even on Windows.
      # Do not install the retired `tools` package (sdkmanager 16+ removed it).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 37
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SM=sdkmanager
          elif command -v sdkmanager.bat >/dev/null 2>&1; then
            SM=sdkmanager.bat
          else
            SM=$(ls "$sdk_root"/cmdline-tools/*/bin/sdkmanager.bat "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            ls -la "$sdk_root" "$sdk_root"/cmdline-tools || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "build-tools;35.0.0"
          "$SM" "platforms;android-37.0" || "$SM" "platforms;android-37"
          if [ -d "$sdk_root/platforms/android-37.0" ] && [ ! -e "$sdk_root/platforms/android-37" ]; then
            cp -a "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -la "$sdk_root/platforms"

      # jpackage/Compose packageMsi needs WiX 3 (candle/light). windows-latest
      # already ships WiX 3.14. Do not choco-install current wixtoolset (v5),
      # which drops that CLI. Fall back to the archived WiX 3.14 binaries.
      - name: Locate WiX 3
        shell: pwsh
        run: |
          $candle = Get-Command candle -ErrorAction SilentlyContinue
          if (-not $candle) {
            $candidates = @(
              "${env:WIX}bin\candle.exe",
              "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) {
              $bin = Split-Path $found
              Add-Content -Path $env:GITHUB_PATH -Value $bin
              Add-Content -Path $env:GITHUB_ENV -Value "WIX=$(Split-Path $bin)\"
            } else {
              $zip = Join-Path $env:RUNNER_TEMP "wix3.zip"
              $dest = Join-Path $env:RUNNER_TEMP "wix3"
              Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
              Expand-Archive $zip -DestinationPath $dest -Force
              Add-Content -Path $env:GITHUB_PATH -Value $dest
              Add-Content -Path $env:GITHUB_ENV -Value "WIX=$dest\"
            }
          }
          Get-Command candle

      - name: Package MSI
        shell: pwsh
        run: |
          if ((Test-Path .\gradlew.bat) -and (Test-Path .\gradle\wrapper\gradle-wrapper.jar)) {
            .\gradlew.bat :desktop:packageMsi --stacktrace --no-daemon
          } else {
            gradle :desktop:packageMsi --stacktrace --no-daemon
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Mags-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/msi/*.msi
          generate_release_notes: true

  apk:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 37
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SM=sdkmanager
          elif command -v sdkmanager.bat >/dev/null 2>&1; then
            SM=sdkmanager.bat
          else
            SM=$(ls "$sdk_root"/cmdline-tools/*/bin/sdkmanager.bat "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            ls -la "$sdk_root" "$sdk_root"/cmdline-tools || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "build-tools;35.0.0"
          "$SM" "platforms;android-37.0" || "$SM" "platforms;android-37"
          if [ -d "$sdk_root/platforms/android-37.0" ] && [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -sfn "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -la "$sdk_root/platforms"

      - name: Ensure release keystore
        run: |
          if [ ! -f app/keystore/mags-dev.jks ]; then
            mkdir -p app/keystore
            keytool -genkeypair -alias mags-dev -keyalg RSA -keysize 2048 -validity 3650 \
              -keystore app/keystore/mags-dev.jks \
              -storepass mags-dev -keypass mags-dev \
              -dname "CN=Mags CI, O=Mags, C=NL"
          fi

      - name: Assemble APKs
        run: |
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Mags-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mags-android-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
